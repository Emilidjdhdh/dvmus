
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DVMUS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;font-weight:700}
header{height:75px;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between;padding:0 35px}
.logo{font-size:30px;letter-spacing:2px}
.profile{background:#222;border-radius:50%;padding:12px;font-size:20px}
.layout{display:flex;min-height:calc(100vh - 75px)}
.sidebar{width:220px;padding:35px 20px;border-right:1px solid #292929}
.sidebar a{display:block;color:#aaa;text-decoration:none;padding:17px 12px;border-radius:10px;font-size:15px}
.sidebar a:hover,.sidebar a.active{background:#252525;color:white}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:35px}
.player{width:min(430px,100%);text-align:center}
.cover{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;background:#222}
.track{font-size:25px;margin:24px 0 7px}
.artist{color:#888;font-size:16px}
.progress{height:4px;background:#444;border-radius:10px;margin:25px 0 10px}
.progress span{display:block;width:35%;height:4px;background:white;border-radius:10px}
.times{display:flex;justify-content:space-between;color:#888;font-size:12px}
.controls{display:flex;align-items:center;justify-content:center;gap:35px;margin-top:25px}
.controls button{background:none;color:white;border:0;font-size:28px;cursor:pointer}
.controls .play{background:white;color:black;width:58px;height:58px;border-radius:50%;font-size:24px}
@media(max-width:650px){
.sidebar{width:125px;padding:20px 8px}
.sidebar a{font-size:12px;padding:14px 8px}
header{padding:0 16px}
main{padding:20px 12px}
.track{font-size:20px}
}
</style>
</head>
<body>
<header>
<div class="logo">DVMUS.</div>
<div class="profile">●</div>
</header>
<div class="layout">
<aside class="sidebar">
<a class="active" href="#">⌂ Главная</a>
<a href="#">⌕ Поиск</a>
<a href="#">♡ Избранное</a>
<a href="#">♫ Плейлисты</a>
<a href="#">◷ История</a>
<a href="#">⚙ Настройки</a>
</aside>
<main>
<div class="player">
<img class="cover" src="https://placehold.co/600x600/171717/FFFFFF?text=DVMUS" alt="Обложка трека">
<div class="track">Название трека</div>
<div class="artist">Имя исполнителя</div>
<div class="progress"><span></span></div>
<div class="times"><span>0:00</span><span>0:00</span></div>
<div class="controls">
<button aria-label="Предыдущий трек">⏮</button>
<button class="play" aria-label="Воспроизведение">▶</button>
<button aria-label="Следующий трек">⏭</button>
</div>
</div>
</main>
</div>
</body>
</html>
